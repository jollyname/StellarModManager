name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true
      title:
        description: 'Release name (e.g. Convenience Update)'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        shell: pwsh
        run: |
          dotnet publish StellarModManager.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$env:VERSION -o App
          Copy-Item License.txt, PostInfo.txt App\
          Copy-Item Assets\icon.ico App\icon.ico

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path App\* -DestinationPath "StellarModManager_${env:VERSION}_Portable.zip"

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" StellarModManager.iss'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.title != '' && format('StellarModManager v{0} | {1}', inputs.version, inputs.title) || format('StellarModManager v{0}', inputs.version) }}
          files: |
            StellarModManager_*_Portable.zip
            Output/StellarModManager_*_Setup.exe
          generate_release_notes: true